services:
  mc:
    image: docker.io/itzg/minecraft-server:java25
    container_name: minecraft-server
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "5G"
    ports:
      - "${TAILSCALE_IP}:25565:25565"
      - "${TAILSCALE_IP}:19132:19132"
    volumes:
      - ./data:/data
