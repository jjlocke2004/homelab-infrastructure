services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/data/media:/data/media
      - ${MEDIA_HDD_PATH}:/hdd
    ports:
      - 8096:8096
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - 127.0.0.1:4533:4533
    volumes:
      - ${COMMON_PATH}/data/music:/music:ro
      - ${COMMON_PATH}/configs/navidrome:/data
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
