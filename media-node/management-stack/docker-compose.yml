services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - ${COMMON_PATH}/data/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - "LOG_LEVEL=info"
      - "LOG_JSON=false"
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=0 */6 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
      - "DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true"
      - "DIUN_NOTIF_DISCORD_WEBHOOKURL=${DISCORD_WEBHOOK_URL}"
      - "DIUN_NOTIF_DISCORD_RENDERFIELDS=true"
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMMON_PATH}/configs/portainer:/data
    ports:
      - 127.0.0.1:9000:9000
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - ${COMMON_PATH}/configs/homepage:/app/config
      - ${COMMON_PATH}/homepage/backgrounds:/app/public/backgrounds:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEDIA_HDD_PATH}:/mnt/hdd:ro
    ports:
      - "3002:3000"
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    volumes:
      - ${COMMON_PATH}/configs/vaultwarden:/data
    ports:
      - 127.0.0.1:8082:80
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik
    volumes:
      - ${COMMON_PATH}/configs/crowdsec:/etc/crowdsec
      - ${COMMON_PATH}/data/crowdsec:/var/lib/crowdsec/data
      - /var/log:/var/log:ro
      - /run/docker.sock:/run/docker.sock:ro
    ports:
      - ${TAILSCALE_IP}:8088:8080
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - ${TAILSCALE_IP}:9100:9100
    restart: unless-stopped
