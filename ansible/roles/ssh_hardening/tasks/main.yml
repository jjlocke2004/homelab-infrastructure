- name: Make sure ansible user has an authorized key (lockout guard)
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: auth_keys

- name: Refuse to continue if there's no key to log in with
  ansible.builtin.assert:
    that:
      - auth_keys.stat.exists
      - auth_keys.stat.size > 0
    fail_msg: "No authorized_keys for {{ ansible_user }}; disabling passwords would lock you out"

- name: Install SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Apply SSH changes now, before the play ends
  ansible.builtin.meta: flush_handlers

- name: Confirm we can still reach the host
  ansible.builtin.wait_for_connection:
    timeout: 30 
